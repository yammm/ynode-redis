name: ci

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        services:
            redis:
                image: redis:7.4-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

        env:
            REDIS_URL: redis://127.0.0.1:6379
        strategy:
            fail-fast: false
            matrix:
                node-version: [20, 22]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run format, lint, and tests
              run: npm run format:check && npm run lint && npm test

    docs:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build docs
              run: npm run docs
